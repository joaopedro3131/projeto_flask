{% include 'cabecalho.html' %}

<div class="container mt-3">
    <h1 class="mb-4">{% if turma %}Editar{% else %}Cadastrar{% endif %} Turma</h1>

    <div class="row">
        <div class="col-12">
            <form action="{% if turma %}/turma/salvar/{{ turma[0] }}{% else %}/turma/salvar/{% endif %}" method="POST">
    
                <!-- Semestre -->
                <div class="mb-3">
                    <label for="semestre" class="form-label">Semestre</label>
                    <input type="text" class="form-control" id="semestre" name="semestre" value="{% if turma %}{{ turma[1] }}{% endif %}" placeholder="Ex: 2024.1" required>
                </div>
        
                <!-- Curso -->
                <div class="mb-3">
                    <label for="curso" class="form-label">Curso</label>
                    <input type="text" class="form-control" id="curso" name="curso" value="{% if turma %}{{ turma[2] }}{% endif %}" required>
                </div>

                <!-- Nome (Professor) -->
                <div class="mb-3">
                    <label for="nome" class="form-label">Professor</label>
                    <input type="text" class="form-control" id="nome" name="nome" value="{% if turma %}{{ turma[3] }}{% endif %}" required>
                </div>
        
                <!-- Botões -->
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a href="/turma" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
