{% include 'cabecalho.html' %}

<h1 class="mb-4">{% if matricula %}Editar Matrícula{% else %}Nova Matrícula{% endif %}</h1>

<div class="row">
  <div class="col-12">
    <form action="{% if matricula %}/matricula/salvar/{{ matricula[0] }}{% else %}/matricula/salvar{% endif %}" method="POST">
      
      <!-- Seleção de Aluno -->
      <div class="mb-3">
        <label for="aluno_id" class="form-label">Aluno</label>
        <select name="aluno_id" id="aluno_id" class="form-select" required>
          <option value="" disabled {% if not matricula %}selected{% endif %}>Selecione um aluno...</option>
          {% for aluno in lista_alunos %}
            <option value="{{ aluno[0] }}" {% if matricula and aluno[0] == matricula[1] %}selected{% endif %}>
              {{ aluno[1] }}
            </option>
          {% endfor %}
        </select>
      </div>

      <!-- Seleção de Turma -->
      <div class="mb-3">
        <label for="turma_id" class="form-label">Turma (Semestre - Curso - Professor)</label>
        <select name="turma_id" id="turma_id" class="form-select" required>
          <option value="" disabled {% if not matricula %}selected{% endif %}>Selecione uma turma...</option>
          {% for turma in lista_turmas %}
            <option value="{{ turma[0] }}" {% if matricula and turma[0] == matricula[2] %}selected{% endif %}>
              {{ turma[1] }} - {{ turma[2] }} (Prof. {{ turma[3] }})
            </option>
          {% endfor %}
        </select>
      </div>

      <!-- Botões -->
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="/matricula" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>

{% include 'rodape.html' %}
